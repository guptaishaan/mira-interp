[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-interp"
version = "0.1.0"
description = "Gated, match-disjoint physical-state interpretability experiments for MIRA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.8", "pydantic>=2.11,<2.12", "einops>=0.8", "huggingface-hub>=0.25", "omegaconf>=2.3", "hydra-core>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["scikit-learn>=1.5", "scipy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "external/mira/src"]
testpaths = ["tests"]

